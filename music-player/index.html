<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Inspiration</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container" id="drop-zone">
        <!-- Main Player Area (Left) -->
        <main class="player-main">
            <!-- Background Shapes -->
            <div class="bg-shape shape-1"></div>
            <div class="bg-shape shape-2"></div>
            
            <header class="player-header">
                <div class="branding">
                    <span>MUSIC</span><br>
                    <span>INSPIRATION</span>
                </div>
                <button id="btn-hamburger" class="icon-btn mobile-menu-btn" aria-label="Menu">
                    <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
            </header>

            <section class="track-info">
                <h1 id="track-title">No song selected</h1>
                <h2 id="track-artist">Import your music to begin</h2>
            </section>

            <section class="vinyl-section">
                <div class="vinyl-record" id="vinyl">
                    <div class="vinyl-grooves"></div>
                    <div class="vinyl-label">
                        <span class="label-text">MUSIC<br>INSP</span>
                    </div>
                    <div class="vinyl-hole"></div>
                </div>
            </section>

            <section class="controls-section">
                <div class="progress-container">
                    <span id="current-time">00:00</span>
                    <div class="progress-bar-wrapper" id="progress-wrapper">
                        <div class="progress-bar" id="progress"></div>
                    </div>
                    <span id="duration">00:00</span>
                </div>

                <div class="playback-controls">
                    <button id="btn-shuffle" class="icon-btn" aria-label="Shuffle">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                    </button>
                    <button id="btn-prev" class="icon-btn" aria-label="Previous Track">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button id="btn-play-pause" class="icon-btn play-btn" aria-label="Play/Pause">
                        <svg id="icon-play" viewBox="0 0 24 24" width="32" height="32"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                        <svg id="icon-pause" viewBox="0 0 24 24" width="32" height="32" style="display:none;"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button id="btn-next" class="icon-btn" aria-label="Next Track">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                    <button id="btn-repeat" class="icon-btn" aria-label="Repeat">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                    </button>
                </div>

                <div class="secondary-controls">
                    <button id="btn-favorite" class="icon-btn" aria-label="Favorite">
                        <svg id="icon-heart-outline" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
                        <svg id="icon-heart-filled" viewBox="0 0 24 24" width="24" height="24" style="display:none;"><path fill="#E83C36" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                    
                    <div class="volume-container">
                        <button id="btn-volume" class="icon-btn" aria-label="Mute/Unmute">
                            <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        </button>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
            </section>
        </main>

        <!-- Playlist Area (Right) -->
        <aside class="playlist-panel" id="playlist-panel">
            <header class="playlist-header">
                <div class="header-top-row">
                    <button id="btn-close-drawer" class="icon-btn mobile-close-btn" aria-label="Close">
                        <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="search-input" placeholder="Search...">
                </div>
                
            </header>

            <div class="import-section">
                <label for="file-import" class="import-btn">
                    + IMPORT MUSIC
                </label>
                <input type="file" id="file-import" accept="audio/*" multiple style="display:none;">
            </div>

            <div class="playlist-container">
                <ul id="playlist" class="playlist">
                    <!-- Playlist items will be injected here via JS -->
                </ul>
            </div>
            
            <div id="drop-overlay" class="drop-overlay">
                <div class="drop-content">
                    <h3>DROP MUSIC HERE</h3>
                    <p>Release to import</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Drawer Overlay -->
    <div id="drawer-overlay" class="drawer-overlay"></div>

    <!-- Notification Toast -->
    <div id="notification" class="notification"></div>
    
    <script src="script.js"></script>
</body>
</html>
